name: Website CI

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check retained historical media
        run: python3 scripts/verify_release_media.py docs/release-media-build6.json --site-only
      - name: Check current media and local links
        run: python3 scripts/verify_site.py
      - name: Check declared versions agree
        run: python3 scripts/storefront_parity.py --declared-only
      - name: Test validator failure paths
        run: python3 -m unittest discover -s scripts/tests -v

  # Fails until the version this branch declares is the one on the Mac App Store,
  # which is correct for a held pull request. The publisher re-evaluates it at
  # decision time and re-runs a stale failure.
  storefront-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the declared version matches the store
        run: python3 scripts/storefront_parity.py
