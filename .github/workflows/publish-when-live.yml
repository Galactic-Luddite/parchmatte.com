name: Publish when live

# Merges an armed website pull request once the Parchmatte version it describes is
# live on the Mac App Store. Arming comes only from release/held.json on main. See
# "Holding a release" in README.md.
# Triggers are the schedule and a manual run only: never pull_request_target, never
# a pull request event, and no pull request code is checked out or run.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would happen without merging'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-when-live
  cancel-in-progress: false

jobs:
  publish:
    # Only ever act from main, so a manual run of another branch cannot supply its own arming file.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The one job that writes: merge and delete the branch (contents, pull-requests),
    # request a Pages build (pages), re-run a stale parity check (actions), and read
    # check results (checks).
    permissions:
      contents: write
      pull-requests: write
      pages: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Merge an armed pull request if its version is live
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 -I scripts/publish_when_live.py --dry-run
          else
            python3 -I scripts/publish_when_live.py
          fi
